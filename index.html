<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Finance Tracker — особисті фінанси</title>
    <meta name="description" content="Персональний облік доходів, витрат, бюджетів, боргів і фінансових цілей." />
    <meta name="theme-color" content="#f3f2ed" />
    <meta name="color-scheme" content="light dark" />
    <!-- Icons for every platform (generated by `npm run icons` from icons-src/icon.mjs) -->
    <link rel="icon" href="./favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" href="./favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="./icons/favicon-32.png?v=2" type="image/png" sizes="32x32" />
    <link rel="icon" href="./icons/favicon-16.png?v=2" type="image/png" sizes="16x16" />
    <link rel="icon" href="./icons/favicon-96.png?v=2" type="image/png" sizes="96x96" />
    <link rel="icon" href="./icons/icon-192.png?v=2" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=2" sizes="180x180" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-167.png?v=2" sizes="167x167" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-152.png?v=2" sizes="152x152" />
    <link rel="mask-icon" href="./icons/safari-pinned-tab.svg" color="#0e8f62" />
    <meta name="msapplication-TileColor" content="#121a17" />
    <meta name="msapplication-TileImage" content="./icons/mstile-150.png?v=2" />
    <meta name="msapplication-config" content="./icons/browserconfig.xml" />
    <meta name="application-name" content="Фінанси" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Фінанси" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        if (localStorage.getItem('ft-theme') === 'dark') document.documentElement.classList.add('dark')
        var ts = localStorage.getItem('ft-text-size')
        if (ts) document.documentElement.style.fontSize = ts
        var ac = localStorage.getItem('ft-accent')
        if (ac && ac !== 'emerald') document.documentElement.setAttribute('data-accent', ac)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для роботи застосунку потрібно увімкнути JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
